# Product defaults.
#
# Merge rules:
# - An optional user file at $DATA_DIR/config.yaml (or CONFIG_FILE) merges on top, key-by-key.
# - Dictionaries merge recursively.
# - A list replaces that list entirely (no concatenation).
# - Setting a key to null removes that key.
# - Invalid YAML or schema violations are logged at startup and ignored; the runner continues with defaults.
#
# Tool classification (read/write precedence):
# 1. Matching 'write' glob -> write.
# 2. Matching 'read' glob -> read.
# 3. annotations.readOnlyHint === true from tools/list -> read ONLY if server has trust: trusted;
#    untrusted servers ignore readOnlyHint and treat the tool as a write.
# 4. Otherwise -> write.
#
# Calls nobody approves (subagents, a scheduled write gate) and the decision to
# resend after a transport failure need a declared read: a 'read' glob of the
# server's own lists (or the executor lists it inherits) with no 'write' glob,
# or a trusted readOnlyHint. A read verb in the name, an `execute` program, or
# a `call` whose target is code is not a declared read there.
# Read/write decides uncertain results, timeouts, and whether a write is retried.
# It is not an approval gate for `executor`, or for a server with no `tools`
# list of its own (that server inherits executor's lists). Executor decides
# approval; the bot only relays the pause. The call is sent. Interactive: the
# existing card. Scheduled: an approval-required pause fails the call with
# "needs approval; not available in scheduled runs" plus the tool path. No card
# and no resume. A server with its own `tools` list (composio) still refuses a
# write in a scheduled run before the call is sent.
# `sandbox_code_task` writes=true still waits for its own card.
#
# Meta/protocol tools:
# 'search', 'describe', and 'skills' stay hardcoded reads in code; the model cannot call 'resume'.
# A server with its own `tools` list must list them to make them declared reads.

# The optional text model fallback is off by default. Choose it in npm run setup
# under Text model. Model selections and credentials live in the volume database.

# Native read tools. Each list is ordered: primary, then fallback. Set [] to
# disable the operation. Keyed providers without a key are skipped. The
# explicitly selected "local" extractor needs no key. Use npm run setup
# or provider API key variables instead of saving keys in this file.
web:
  search: [exa, context]
  extract: [exa, context]

mcp_servers:
  # Map of MCP server names to their trust level and tool lists.
  # Servers without their own 'tools' list inherit executor's lists and its approval.
  executor:
    # trust: 'trusted' | 'untrusted' (default). Only trusted servers honor annotations.readOnlyHint as reads.
    trust: untrusted
    tools:
      # Globs for read-only tools. '.' separates segments; '*' matches one segment; '**' crosses segments.
      read:
        # Concrete paths (previously KNOWN_READS).
        - "tools.search"
        - "tools.describe"
        - "tools.tinyfish.agent.runs.getRunById"
        - "tools.tinyfish.agent.runs.listRuns"
        - "tools.instabox.machines.readFiles"
        - "tools.instabox.machines.list"
        - "tools.tinyfish.fetch.root.fetchUrls"
        - "tools.tinyfish.search.root.search"
        # Leaf prefix (previously READ_VERBS), any depth.
        - "get*"
        - "list*"
        - "read*"
        - "search*"
        - "fetch*"
        - "find*"
        - "query*"
        - "describe*"
        - "show*"
        - "view*"
        - "status*"
        - "**.get*"
        - "**.list*"
        - "**.read*"
        - "**.search*"
        - "**.fetch*"
        - "**.find*"
        - "**.query*"
        - "**.describe*"
        - "**.show*"
        - "**.view*"
        - "**.status*"
        # A leaf these prefixes miss is still a read when a read verb is its own
        # camelCase word (inboxesMessagesList, v1ExtractPost). A write verb in
        # that leaf stays a write. See docs/mcp-uncertain.md. The name alone
        # never lets a subagent or scheduled run send the call.
      # Globs for write tools. Takes precedence over read globs.
      # A name like get_or_create matches **.get* and must still be a write.
      write:
        - "**.*create*"
        - "**.*send*"
        - "**.*delete*"
        - "**.*update*"
  # Composio slugs are TOOLKIT_ACTION. An infix verb (*_GET_*, *_LIST_*, *_SEARCH_*, and the same set) is a read.
  composio:
    # Own tool list, so a scheduled write is still refused before it is sent.
    trust: untrusted
    tools:
      read:
        - "*_GET_*"
        - "*_LIST_*"
        - "*_SEARCH_*"
        - "*_FETCH_*"
        - "*_FIND_*"
        - "*_QUERY_*"
        - "*_DESCRIBE_*"
        - "*_SHOW_*"
        - "*_VIEW_*"
        - "*_STATUS_*"
      write: []

# Worker that watches every async job. Per-job read cadence stays on each
# manifest (`poll`, `graceMinutes`). Override in $DATA_DIR/config.yaml.
# ASYNC_JOB_TIMEOUT_MIN and ASYNC_JOB_POLL_SECONDS still override when set.
async_job:
  # Minutes before a still-running job is announced.
  timeout_min: 25
  # Seconds between worker wake-ups.
  poll_seconds: 25

# Async jobs. Each entry declares how a background job is dispatched, polled, and read.
#
# Polling mechanism:
# - server: executor (or omitted): polled inside execute.
# - Any other server: polled directly via callDirect on observe.tool.
#
# Override:
# - ASYNC_JOB_MANIFESTS env var still merges on top, matched by tool.
async_jobs:
  # Descriptive job label.
  tinyfish:
    # MCP tool path that dispatches the job.
    tool: "tools.tinyfish.agent.automation.runAsync"
    # Target server: 'executor' polls inside execute; other servers poll directly via callDirect.
    server: executor
    # Dispatch contract: how job id is retrieved from the initial call response.
    dispatch:
      mode: immediate
      idPath: run_id
    # Observation contract: tool and argument template to poll job progress and final status.
    observe:
      mode: poll
      tool: "tools.tinyfish.agent.runs.getRunById"
      args:
        accountId: "${accountId}"
        input:
          path:
            id: "${job_id}"
      statePath: status
      resultPath: result
      errorPath: error
    # Reconciliation contract: look up in-flight runs if initial dispatch response was lost.
    reconcile:
      tool: "tools.tinyfish.agent.runs.listRuns"
      args:
        accountId: "${accountId}"
        input:
          query:
            goal: "${goal}"
            limit: 20
            sort_direction: desc
      match: goalSuffix
      windowMinutes: 15
    # Polling cadence, backoff steps (seconds), and max retries per attempt.
    poll:
      intervalSeconds: 25
      backoff: [25, 60, 150]
      maxAttempts: 3
    # Grace window (minutes) before marking an unacknowledged job as failed.
    graceMinutes: 5
  instabox_status:
    # Internal dispatch tool for sandbox code tasks.
    tool: "internal.instabox.codeTask"
    server: executor
    dispatch:
      mode: immediate
    observe:
      mode: poll
      tool: "tools.instabox.machines.readFiles"
      args:
        accountId: "${INSTABOX_ACCOUNT_ID}"
        input:
          id: "${INSTABOX_MACHINE_ID}"
          path: "/data/home/jobs/${id}/status.json"
      statePath: state
      resultPath: result
      errorPath: error
    poll:
      intervalSeconds: 20
      backoff: [20, 30, 60]
      maxAttempts: 3
    graceMinutes: 3
    # When the env var is unset, list and pick. A set env var or a value in
    # $DATA_DIR/config.yaml wins. There is no default machine name.
    # The account step picks only when exactly one account is linked.
    # The machine step picks only when exactly one machine is running.
    # Zero or several is an error that lists them; nothing is chosen.
    discover:
      - var: INSTABOX_ACCOUNT_ID
        tool: search
        args:
          namespace: tools.instabox
          limit: 20
        pick: single
      - var: INSTABOX_MACHINE_ID
        tool: tools.instabox.machines.list
        args:
          accountId: "${INSTABOX_ACCOUNT_ID}"
          input: {}
        list: machines
        id: id
        label: name
        running: state

# Internal sandbox code task. `tool` is the tool the model calls; `job` is the
# async_jobs manifest above that polls the result. `exec` is the dispatch call,
# rendered with environment variables, `${job_id}` and `${payload}` (the JSON
# parameter object). Unset ids are filled by that manifest's `discover` steps.
# `allow` filters one parameter. Swapping sandbox = editing this block and
# the manifest, not code.
sandbox_code_task:
  tool: sandbox_code_task
  description: "For long-running code tasks the user authorizes with write access, call this tool once with writes=true. It requests approval in chat before the task starts and delivers the result automatically without model polling. Do not use it for read-only tasks."
  job: "internal.instabox.codeTask"
  goal: prompt
  idPrefix: "cj-"
  server: executor
  exec:
    tool: "tools.instabox.machines.exec"
    args:
      accountId: "${INSTABOX_ACCOUNT_ID}"
      input:
        id: "${INSTABOX_MACHINE_ID}"
        cmd: "bash ~/bin/start-job.sh ${job_id}"
        timeoutSeconds: 15
        stdin: "${payload}"
  allow:
    field: repo
    # Comma-separated. `owner/*` matches that owner. Empty until the operator
    # sets `patterns` in $DATA_DIR/config.yaml or INSTABOX_REPO_ALLOWLIST.
    # Nothing is allowed until one of those is set. A set env var wins.
  parameters:
    type: object
    required: [repo, agent, prompt]
    properties:
      repo:
        type: string
        pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
        description: "Allowed repository in owner/name format"
      agent:
        type: string
        enum: [agy, pi, claude]
        description: "Agente executor na sandbox (agy, pi ou claude)"
      prompt:
        type: string
        minLength: 1
        maxLength: 32768
        pattern: "\\S"
        description: "Complete instructions for the code task"
      branch:
        type: string
        description: "Optional base or target branch (default agent/<jobId>)"
      writes:
        type: boolean
        description: "Set to true only when the user authorizes write access. The bot requests approval before starting. Omitting this field or setting it to false is rejected."

# Eyes on an inbound message that starts a turn. The reaction waits this many
# milliseconds. A reply that is sent first cancels it, so a fast chat stays
# quiet. 0 reacts immediately (the previous behavior). Override in
# $DATA_DIR/config.yaml. There is no environment variable for this.
reaction_delay_ms: 4000

# /receipt always works. Enable this to append a short line to final chat replies.
turn_receipt:
  footer: false

# WhatsApp sends a file as bytes, so the bot itself downloads an MCP
# attachment that carries only a URL. By default it downloads nothing: only
# attachments with inline bytes are sent. Each host listed here (exact name,
# HTTPS only) is allowed, and every redirect must also land on a listed host.
# A download stops at timeout_seconds or past max_mb. Telegram passes URLs to
# Telegram and does not use this list.
whatsapp:
  attachment_urls:
    hosts: []
    timeout_seconds: 20
    max_mb: 16

# Operator skills (prompt text on the volume). Not the MCP `skills` tool.
# Each entry is a folder name under $DATA_DIR/skills/<name>/SKILL.md.
# The file starts with YAML frontmatter (`name` equal to the folder, and
# `description`) and a markdown body. The system prompt lists each name and
# description, in that order, after the base instructions and before MCP
# sections. The model loads a body with the read-only read_skill tool. The
# list is the same on every reply, including scheduled runs. An empty list
# leaves the prompt unchanged and does not register the tool. A missing
# folder, a missing name, invalid frontmatter, or an unreadable file is logged
# at startup and skipped; the bot still boots. An unknown read_skill name
# returns an error and no body.
skills:
  always: []

# Long-term Markdown memory on the volume. Restart after changing this block.
# By default the curator uses the conversation's model; no extra model is required.
memory:
  enabled: true
  # curator_model:
  #   provider: openai
  #   model_id: your-configured-model-id

# Subagents (docs/subagents.md). When enabled, the model may call the
# `subagent` tool to hand self-contained read-only work to a child
# conversation and get only its final answer back. The child uses the same
# model, sees only MCP tools (plus tool_search when some tool is deferred), and
# every MCP call that is not a declared read (a read glob of the server's list
# or a trusted readOnlyHint, never a name) is refused before it is sent. No approval
# card, schedule, notify, file or job comes from a child. /stop also stops
# running subagents. Read at startup: a change needs a restart. Off, the prompt
# and tool list are exactly the same as without this block. An invalid value
# is logged and keeps its default.
subagents:
  enabled: false
  # Tasks one call may run at once, 1 to 3.
  max_parallel: 3
  # Tool rounds a child may take, 1 to 20. It then ends without an answer.
  max_turns: 8
  # off, minimal, low, medium or high.
  thinking: low
